<!DOCTYPE html>
<html>
</head>

<body>
    <h2>Javascript Functions</h2>
    <p id="demo"></p>
    <script>
        function add(a, b) {
            return a + b;
        }
        function average(a, b) {
            return add(a, b) / 2
        }
        let result = average(3456, 2086);
        document.getElementById("demo").innerHTML = result;
    </script>
</body>

</html>
